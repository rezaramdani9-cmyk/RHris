name: Backup data
on:
  schedule:
    - cron: '0 17 * * 6'   # tiap Minggu 00:00 WIB
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Salin data
        run: |
          mkdir -p backup
          d=$(date +%F)
          cp data/vault.json "backup/vault-$d.json"
          ls -1 backup/vault-*.json | sort | head -n -26 | xargs -r rm
      - name: Simpan ke repo
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backup
          if ! git diff --cached --quiet; then
            git commit -m "Backup otomatis $(date +%F)"
            git push
          fi
