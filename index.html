<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reza HRIS</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1220;--sb:#0e1a2e;--cd:#121b2b;--bd:#1f2b40;--tx:#e8edf5;--mu:#7f93b0;--am:#f0a830;--ok:#34c38f;--bad:#ef5b5b;--bl:#5aa7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:13px 'Space Grotesk',system-ui,sans-serif}
.app{display:flex;min-height:100vh}aside{width:220px;background:var(--sb);border-right:1px solid var(--bd);padding:14px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.logo{display:flex;gap:9px;align-items:center;padding:4px 6px 14px}.logo i{background:var(--am);color:#1a1200;border-radius:7px;width:30px;height:30px;display:grid;place-items:center;font-style:normal;font-weight:700}
.logo b{display:block}.logo small,.mu{color:var(--mu)}
aside a{color:var(--tx);text-decoration:none;padding:8px 10px;border-radius:7px;opacity:.8}aside a:hover{background:#15243b}aside a.on{background:#1b3556;opacity:1;font-weight:700}
.me{margin-top:auto;border-top:1px solid var(--bd);padding:12px 6px 0;display:flex;justify-content:space-between;align-items:center}
main{flex:1;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 24px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
h1{font-size:17px;margin:0}.top p{margin:2px 0 0;color:var(--mu);font-size:11px}section{max-width:1080px;margin:0 auto;padding:18px 24px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:9px;padding:14px;margin-bottom:14px}.cards .card{margin:0}
.card h3{margin:0 0 10px;font-size:13px}.num{font-size:26px;font-weight:700;margin:4px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid2 .card{margin:0}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--bl);font-size:11px;padding:9px 10px;background:#0d1626;white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--bd)}
button,.btn{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--bd);background:#14223a;color:var(--tx);padding:7px 12px}
.p{background:var(--am);color:#1a1200;border-color:var(--am);font-weight:700}.ic{padding:4px 8px;font-size:11px;margin-right:4px}.dg{color:var(--bad)}
input,select,textarea{font:inherit;background:#0a111d;border:1px solid var(--bd);color:var(--tx);border-radius:7px;padding:8px 10px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--am);outline-offset:1px}
label{display:block;color:var(--mu);font-size:11px;margin-bottom:10px}label input,label select{margin-top:4px;color:var(--tx)}
.bar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:end}.bar>*{width:auto;min-width:140px}
.b{padding:2px 8px;border-radius:99px;font-size:11px;background:#16294a;color:var(--bl)}
.Hadir,.Disetujui,.Aktif{background:#12362e;color:var(--ok)}.Terlambat,.Menunggu{background:#3a2c0e;color:var(--am)}.Alpha,.Ditolak,.Nonaktif{background:#3b1717;color:var(--bad)}
.mb{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:9;padding:14px}.md{background:var(--cd);border:1px solid var(--bd);border-radius:11px;padding:20px;width:420px;max-width:100%;max-height:92vh;overflow:auto}
.md h3{margin:0 0 14px}.r{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.center{min-height:100vh;display:grid;place-items:center;padding:16px}.box{width:360px;max-width:100%}.box h2{margin:0 0 4px}
#toast{position:fixed;bottom:18px;right:18px;background:#1b3556;border:1px solid var(--bl);padding:10px 14px;border-radius:8px;z-index:20;display:none}
.dept div{margin-bottom:9px}.dept i{display:block;height:6px;background:var(--am);border-radius:4px;margin-top:3px}
#sync{font-size:10px;color:var(--mu);padding:6px}
button:disabled{opacity:.4;cursor:not-allowed}.gps{padding:10px;border-radius:8px;margin:12px 0;font-size:12px;text-align:left}.okc{background:#12362e;color:var(--ok)}.warnc{background:#3b1717;color:var(--bad)}
@media(max-width:800px){.app{flex-direction:column}aside{position:static;width:auto;height:auto;flex-direction:row;overflow-x:auto;align-items:center}aside a{white-space:nowrap}.me,.logo small{display:none}.grid2{grid-template-columns:1fr}section,.top{padding:12px}}
@media print{aside,.top button,.bar,.ic,#toast{display:none}body{background:#fff;color:#000}.card{border-color:#999;background:#fff}th{background:#eee;color:#000}td{border-color:#ccc}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script></head><body>
<div id="root"></div><div id="m"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0'),ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,today=()=>ymd(new Date()),dmy=d=>(d||'').split('-').reverse().join('/');
const rp=n=>'Rp'+Math.round(n||0).toLocaleString('id-ID'),mins=t=>{const[a,b]=(t||'0:0').split(':');return a*60+ +b};
let db,sha,me,q=Promise.resolve(),HD=today(),BM=today().slice(0,7);
const sha256=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const b64=s=>{let x='';new TextEncoder().encode(s).forEach(c=>x+=String.fromCharCode(c));return btoa(x)};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}
/* ===== Database di GitHub lewat server kecil (worker.js) ===== */
const API=''; /* isi sekali dengan alamat Worker, mis. https://reza-hris.namaanda.workers.dev */
let tok=sessionStorage.hris_tok||'';
const H=()=>({Authorization:'Bearer '+tok,'Content-Type':'application/json'}),out=()=>{sessionStorage.clear();location.reload()};
const er=async r=>(await r.json().catch(()=>({}))).error||'Server '+r.status;
async function load(){const r=await fetch(API+'/db',{headers:H(),cache:'no-store'});if(r.status==401){out();throw new Error('Sesi habis')}if(!r.ok)throw new Error(await er(r));const j=await r.json();db=j.db;db.locs||=[];db.slips||=[];sha=j.v}
async function save(){const r=await fetch(API+'/db',{method:'PUT',headers:H(),body:JSON.stringify({db,v:sha})});
 if(r.status==409){toast('Data diubah dari tempat lain. Dimuat ulang, ulangi perubahan Anda.');await load();return false}
 if(r.status==401){out();return false}if(!r.ok){toast('Gagal menyimpan ('+r.status+')');return false}sha=(await r.json()).v;return true}
async function commit(){q=q.then(save).catch(e=>toast('Gagal: '+e.message));await q;render()}
/* ===== Logika absensi ===== */
const S=()=>db.settings,act_=()=>db.employees.filter(e=>e.status!='Nonaktif'),empName=id=>(db.employees.find(e=>e.id==id)||{}).nama||'(dihapus)';
const isWork=d=>S().workdays.includes(new Date(d+'T00:00').getDay()),late=t=>mins(t)>mins(S().shiftIn)+ +S().tol;
const mdays=(y,m)=>[...Array(new Date(y,m,0).getDate())].map((_,i)=>`${y}-${pad(m)}-${pad(i+1)}`);
function st(eid,d){const e=db.employees.find(x=>x.id==eid),r=db.attendance.find(a=>a.emp==eid&&a.date==d),l=db.leaves.find(l=>l.emp==eid&&l.status=='Disetujui'&&l.from<=d&&d<=l.to);
 if(r&&r.in)return{s:late(r.in)?'Terlambat':'Hadir',r};if(l)return{s:l.type};if(e&&e.join>d)return{s:'-'};return{s:isWork(d)?'Alpha':'Libur'}}
function sumM(eid,y,m){const c={Hadir:0,Terlambat:0,Alpha:0,Cuti:0,Izin:0,Sakit:0,mn:0};mdays(y,m).filter(d=>d<=today()).forEach(d=>{const x=st(eid,d);if(x.s in c)c[x.s]++;if(x.r&&x.r.out)c.mn+=Math.max(0,mins(x.r.out)-mins(x.r.in))});return c}
const hrs=o=>Math.max(0,mins(o.to)-mins(o.from))/60,jam=m=>`${Math.floor(m/60)}j ${pad(m%60)}m`;
function log(a,d,x){db.log.unshift({t:new Date().toISOString(),u:me.nama,a,d,x});db.log.length=Math.min(db.log.length,300)}
/* ===== Komponen UI ===== */
const tbl=(h,rows)=>`<div class=tw><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan=${h.length} class=mu>Belum ada data.</td></tr>`}</tbody></table></div>`;
const bd=s=>`<span class="b ${s}">${esc(s)}</span>`,stat=(l,v,s)=>`<div class=card><div class=mu>${l}</div><div class=num>${v}</div><div class=mu>${s}</div></div>`;
const act=(c,id)=>`<button class=ic onclick="form('${c}','${id}')">Ubah</button><button class="ic dg" onclick="del('${c}','${id}')">Hapus</button>`;
const HINT={karyawan:'Import Excel: kolom NIK, Nama, Departemen, Jabatan, Gaji, Tanggal Bergabung, Status.',absensi:'Import Excel: kolom NIK, Tanggal, Jam Masuk, Jam Keluar, Keterangan (NIK harus sudah terdaftar).'};
const search=()=>`<div class=bar><input placeholder="Cari nama / NIK..." oninput="flt(this)" style="min-width:240px"></div>${HINT[location.hash.slice(1)]?`<p class=mu style="margin:-4px 0 10px">${HINT[location.hash.slice(1)]}</p>`:''}`;
const flt=i=>{const v=i.value.toLowerCase();document.querySelectorAll('section tbody tr').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(v))};
const add=(c,l)=>`<button class=p onclick="form('${c}')">+ ${l}</button>`;
const impBtn=c=>`<label class=btn style="display:inline-block;margin:0 6px 0 0;font-size:13px;color:var(--tx);cursor:pointer">Import Excel<input type=file accept=".xlsx,.xls,.csv" hidden onchange="imp('${c}',this)"></label>`;
const g=(r,...k)=>{const h=Object.keys(r).find(h=>k.some(x=>h.toLowerCase().replace(/[^a-z]/g,'').includes(x)));return h?r[h]:''};
const XD=v=>{if(typeof v=='number')return new Date((Math.floor(v)-25569)*864e5).toISOString().slice(0,10);const s=String(v||'').trim();let m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);if(m)return`${m[1]}-${pad(m[2])}-${pad(m[3])}`;m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);return m?`${m[3]}-${pad(m[2])}-${pad(m[1])}`:''};
const XT=v=>{if(typeof v=='number'){const t=Math.round((v%1)*1440);return`${pad(Math.floor(t/60)%24)}:${pad(t%60)}`}const m=String(v||'').match(/(\d{1,2})[:.](\d{2})/);return m?`${pad(m[1])}:${m[2]}`:''};
async function imp(c,i){const f=i.files[0];i.value='';if(!f)return;try{const wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});let n=0,u=0,x=0;
 for(const r of rows){const nik=String(g(r,'nik')).trim();if(!nik){x++;continue}
  if(c=='employees'){const nama=String(g(r,'nama')).trim();if(!nama){x++;continue}const o={nik,nama,dept:String(g(r,'dep','divisi')).trim(),jabatan:String(g(r,'jabatan','posisi')).trim(),salary:+g(r,'gaji','salary')||0,join:XD(g(r,'bergabung','join'))||today(),status:/non/i.test(g(r,'status'))?'Nonaktif':'Aktif'};const e=db.employees.find(z=>z.nik==nik);e?(Object.assign(e,o),u++):(db.employees.push({id:uid(),...o}),n++)}
  else{const e=db.employees.find(z=>z.nik==nik),date=XD(g(r,'tanggal','tgl','date'));if(!e||!date){x++;continue}const o={emp:e.id,date,in:XT(g(r,'masuk','datang')),out:XT(g(r,'keluar','pulang')),note:String(g(r,'keterangan','catatan')).trim()},a=db.attendance.find(z=>z.emp==e.id&&z.date==date);a?(Object.assign(a,o),u++):(db.attendance.push({id:uid(),...o}),n++)}}
 log('import',C[c].t,`${n} baru, ${u} diperbarui`);toast(`Import selesai: ${n} baru, ${u} diperbarui, ${x} dilewati`);await commit()}catch(e){toast('Gagal membaca file: '+e.message)}}

function csv(name,h,rows){const t=[h,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download=name+'.csv';a.click()}
/* ===== Form generik ===== */
const ST=['Menunggu','Disetujui','Ditolak'];
const C={
 employees:{t:'Karyawan',f:[['nik','NIK'],['nama','Nama'],['dept','Departemen'],['jabatan','Jabatan'],['salary','Gaji pokok (Rp)','number'],['join','Tanggal bergabung','date'],['status','Status','select',['Aktif','Nonaktif']]],def:()=>({status:'Aktif',join:today()})},
 attendance:{t:'Absensi',f:[['emp','Karyawan','emp'],['date','Tanggal','date'],['in','Jam masuk','time'],['out','Jam keluar','time'],['note','Keterangan']],def:()=>({date:today(),in:S().shiftIn,out:S().shiftOut})},
 leaves:{t:'Pengajuan',f:[['emp','Karyawan','emp'],['type','Jenis','select',['Cuti','Izin','Sakit','Izin Terlambat','Izin Pulang Cepat']],['from','Mulai','date'],['to','Selesai','date'],['reason','Alasan'],['status','Status','select',ST]],def:()=>({from:today(),to:today(),status:'Menunggu'})},
 overtime:{t:'Lembur',f:[['emp','Karyawan','emp'],['date','Tanggal','date'],['from','Dari jam','time'],['to','Sampai jam','time'],['note','Keterangan'],['status','Status','select',ST]],def:()=>({date:today(),from:S().shiftOut,status:'Menunggu'})},
 locs:{t:'Lokasi',f:[['name','Nama lokasi'],['lat','Latitude','number'],['lng','Longitude','number'],['r','Radius (meter)','number']],def:()=>({r:50})},
 slips:{t:'Slip gaji',f:[]},
 users:{t:'Pengguna',f:[['username','Username'],['nama','Nama'],['role','Role','select',['Admin','HRD','Staff']],['emp','Terkait karyawan (wajib untuk Staff)','emp0'],['password','Password (kosongkan jika tidak diubah)','password']],def:()=>({role:'HRD'})}};
function form(c,id){const k=C[c];if(c!='employees'&&c!='users'&&!db.employees.length)return toast('Tambah data karyawan dulu.');
 const o=id?db[c].find(x=>x.id==id):k.def();
 $('#m').innerHTML=`<div class=mb onclick="if(event.target==this)mx()"><form class=md onsubmit="return sv(event,'${c}','${id||''}')"><h3>${id?'Ubah':'Tambah'} ${k.t}</h3>${k.f.map(([n,l,t,op])=>`<label>${l}${t=='select'?`<select name=${n}>${op.map(v=>`<option ${o[n]==v?'selected':''}>${v}</option>`).join('')}</select>`:t=='emp'||t=='emp0'?`<select name=${n}>${t=='emp0'?'<option value="">-</option>':''}${db.employees.map(e=>`<option value=${e.id} ${o[n]==e.id?'selected':''}>${esc(e.nama)}</option>`).join('')}</select>`:`<input name=${n} type=${t||'text'} step=any value="${t=='password'?'':esc(o[n])}" ${n=='nama'||n=='username'||n=='date'?'required':''}>`}</label>`).join('')}<div class=r><button type=button onclick=mx()>Batal</button><button class=p>Simpan</button></div></form></div>`}
const mx=()=>$('#m').innerHTML='';
async function sv(ev,c,id){ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target));
 if(c=='users'){if(d.password)d.hash=await sha256(d.username+':'+d.password);delete d.password;if(!id&&!d.hash){toast('Password wajib diisi');return false}}
 if(c=='attendance'){const x=db.attendance.find(a=>a.emp==d.emp&&a.date==d.date);if(x)id=x.id}
 if(id)Object.assign(db[c].find(x=>x.id==id),d);else db[c].push({id:uid(),...d});
 log(id?'ubah':'tambah',C[c].t,d.nama||d.username||d.name||empName(d.emp)+' '+(d.date||d.from||''));mx();await commit();return false}
async function del(c,id){if(!confirm('Hapus data ini?'))return;const x=db[c].find(x=>x.id==id);db[c]=db[c].filter(x=>x.id!=id);log('hapus',C[c].t,x.nama||x.username||x.name||empName(x.emp));await commit()}
/* ===== Halaman ===== */
const P={};
P.dashboard=()=>{const A=act_(),t=today(),cnt=d=>{const r={Hadir:0,Terlambat:0,Alpha:0};A.forEach(e=>{const s=st(e.id,d).s;if(s in r)r[s]++});return r},c=cnt(t);
 const days=[];for(let d=new Date();days.length<14;d.setDate(d.getDate()-1)){const s=ymd(d);if(isWork(s))days.unshift(s)}
 const ser=days.map(cnt),W=700,H=150,mx_=Math.max(1,A.length),line=(k,col)=>`<polyline fill=none stroke=${col} stroke-width=2 points="${ser.map((r,i)=>`${20+i*(W-40)/Math.max(1,ser.length-1)},${H-20-r[k]/mx_*(H-40)}`).join(' ')}"/>`;
 const dp={};A.forEach(e=>dp[e.dept||'-']=(dp[e.dept||'-']||0)+1);
 const rec=[...db.attendance].sort((a,b)=>b.date.localeCompare(a.date)||(b.in||'').localeCompare(a.in||'')).slice(0,8);
 return{t:'Dashboard',s:'Ringkasan kepegawaian & kehadiran',h:`<div class=cards>${stat('Karyawan aktif',A.length,'dari '+db.employees.length+' terdaftar')}${stat('Hadir hari ini',c.Hadir,'')}${stat('Terlambat',c.Terlambat,'toleransi '+S().tol+' menit')}${stat('Alpha hari ini',c.Alpha,isWork(t)?'belum ada data kehadiran':'hari libur')}</div>
 <div class=card><h3>Tren kehadiran — 14 hari kerja terakhir</h3><svg viewBox="0 0 ${W} ${H}" width=100%>${line('Hadir','#34c38f')}${line('Terlambat','#f0a830')}${line('Alpha','#ef5b5b')}</svg><div class=mu>Hijau: hadir · Kuning: terlambat · Merah: alpha</div></div>
 <div class=grid2><div class=card><h3>Absensi terbaru</h3>${tbl(['Tanggal','Nama','Masuk','Status'],rec.map(a=>[dmy(a.date),esc(empName(a.emp)),a.in||'-',bd(st(a.emp,a.date).s)]))}</div>
 <div class="card dept"><h3>Karyawan per departemen</h3>${Object.entries(dp).map(([k,v])=>`<div>${esc(k)} <b style=float:right>${v}</b><i style="width:${v/A.length*100}%"></i></div>`).join('')||'<span class=mu>Belum ada data.</span>'}</div></div>`}};
P.karyawan=()=>({t:'Data Karyawan',s:'Kelola data induk karyawan',a:impBtn('employees')+add('employees','Tambah Karyawan'),h:search()+`<div class=card>${tbl(['NIK','Nama','Departemen','Jabatan','Gaji pokok','Status','Bergabung',''],db.employees.map(e=>[esc(e.nik),esc(e.nama),esc(e.dept),esc(e.jabatan),rp(e.salary),bd(e.status),dmy(e.join),act('employees',e.id)]))}</div>`});
P.absensi=()=>({t:'Data Absensi',s:'Data kehadiran harian',a:impBtn('attendance')+add('attendance','Tambah Absensi'),h:search()+`<div class=card>${tbl(['Tanggal','Nama','Masuk','Keluar','Jam kerja','Status','Keterangan',''],[...db.attendance].sort((a,b)=>b.date.localeCompare(a.date)).map(a=>[dmy(a.date),esc(empName(a.emp)),a.in||'-',a.out||'-',a.in&&a.out?jam(mins(a.out)-mins(a.in)):'-',bd(st(a.emp,a.date).s),esc(a.note),act('attendance',a.id)]))}</div>`});
P.cuti=()=>{const y=new Date().getFullYear(),dd=l=>Math.round((new Date(l.to)-new Date(l.from))/864e5)+1;
 const used=e=>db.leaves.filter(l=>l.emp==e.id&&l.type=='Cuti'&&l.status=='Disetujui'&&l.from.startsWith(y)).reduce((a,l)=>a+dd(l),0);
 return{t:'Cuti & Izin',s:'Pengajuan dan persetujuan cuti, izin, sakit',a:add('leaves','Ajukan Cuti/Izin'),h:`<div class=cards>${stat('Menunggu',db.leaves.filter(l=>l.status=='Menunggu').length,'perlu ditinjau')}${stat('Total pengajuan',db.leaves.length,'sepanjang waktu')}</div>
 <div class=card>${tbl(['Karyawan','Jenis','Periode','Hari','Alasan','Status',''],db.leaves.map(l=>[esc(empName(l.emp)),bd(l.type),dmy(l.from)+' – '+dmy(l.to),dd(l),esc(l.reason),bd(l.status),act('leaves',l.id)]))}</div>
 <div class=card><h3>Sisa cuti ${y}</h3>${tbl(['Nama','Jatah','Terpakai','Sisa'],act_().map(e=>[esc(e.nama),S().quota,used(e),S().quota-used(e)]))}</div>`}};
P.lembur=()=>{const ap=db.overtime.filter(o=>o.status=='Disetujui'&&o.date.startsWith(today().slice(0,7))),h=ap.reduce((a,o)=>a+hrs(o),0);
